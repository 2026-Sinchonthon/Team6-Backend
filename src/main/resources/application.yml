spring:
  application:
    name: backend
  profiles:
    active: local

  # 카카오는 스프링 시큐리티 기본 제공 provider 가 아니라 provider 설정까지 직접 적어야 합니다.
  # client-id / client-secret 은 카카오 개발자센터에서 발급받아 환경변수로 주입하세요.
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: Kakao
            client-id: ${KAKAO_CLIENT_ID:kakao-client-id-not-set}
            client-secret: ${KAKAO_CLIENT_SECRET:kakao-client-secret-not-set}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            # 카카오 개발자센터 > 카카오 로그인 > 동의항목 에서 켜둔 항목만 넣을 수 있습니다.
            # 설정하지 않은 항목을 넣으면 로그인 시점에 KOE205 로 실패합니다.
            #
            # account_email 은 선택 동의라 사용자가 거부할 수 있습니다.
            # 그 경우 User.email 은 null 로 저장됩니다. (설계상 허용)
            scope: ${KAKAO_SCOPE:profile_nickname,profile_image}
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

jwt:
  # 기본값을 두지 않았습니다 — 로컬 개발용 기본값은 application-local.yml 에만 있습니다.
  # 여기 기본값을 두면, 운영에서 JWT_SECRET 설정을 빠뜨렸을 때 서버가 에러 없이
  # 뜨면서 레포에 공개된 값으로 조용히 서명하게 됩니다. 설정을 빠뜨리면 아예
  # 안 뜨는 쪽이 안전합니다.
  secret: ${JWT_SECRET}
  access-token-validity: 3600000        # 1시간
  refresh-token-validity: 1209600000    # 14일

cors:
  # 배포 시 CORS_ALLOWED_ORIGINS 로 덮어쓰세요.
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

app:
  oauth2:
    # 카카오 로그인이 끝나면 이 주소로 돌려보냅니다.
    #   성공: {redirect-uri}?accessToken=...&refreshToken=...&isNewUser=...
    #   실패: {redirect-uri}?error=social_login_failed
    redirect-uri: ${OAUTH2_REDIRECT_URI:http://localhost:5173/oauth/callback}

    # 로그인 시작 시 ?redirect_uri= 로 다른 콜백 주소를 지정할 수 있습니다.
    # 아래 출처에서 온 주소만 허용합니다. 검증을 빼면 임의 사이트로 토큰이 새어나갑니다.
    allowed-redirect-origins: ${OAUTH2_ALLOWED_REDIRECT_ORIGINS:http://localhost:3000,http://localhost:5173}
