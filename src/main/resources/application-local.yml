spring:
  datasource:
    url: jdbc:h2:mem:backend
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

jwt:
  # 로컬 개발 전용 기본값. 운영(application.yml 의 기본 secret)에는 기본값이 없습니다.
  secret: ${JWT_SECRET:sinchonton-local-dev-secret-key-do-not-use-in-production-32bytes}
