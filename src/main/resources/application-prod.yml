# 배포용 프로필. 비밀값은 전부 환경변수로 주입합니다.
#
# 필수 환경변수
#   DB_URL, DB_USERNAME, DB_PASSWORD
#   JWT_SECRET
#   KAKAO_CLIENT_ID, KAKAO_CLIENT_SECRET
#   OAUTH2_REDIRECT_URI, OAUTH2_ALLOWED_REDIRECT_ORIGINS, CORS_ALLOWED_ORIGINS
#   ADMIN_KEY
server:
  port: ${PORT:8080}
  forward-headers-strategy: framework

# 관리자 API(/api/admin/**) 호출 시 X-Admin-Key 헤더에 넣어야 하는 값.
# 기본값을 두지 않았습니다 — 설정을 빠뜨리면 관리자 API가 항상 403이 나므로,
# "빠뜨리면 조용히 약한 기본값으로 열리는 것"보다 "빠뜨리면 아예 안 열리는 것"이 안전합니다.
admin:
  key: ${ADMIN_KEY}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: false

logging:
  level:
    com.sinchonton: info
    org.hibernate.SQL: warn
